<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with smooth premium gradient -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Stylized premium glowing 'L' representing Lutfi & HasLab -->
  <g transform="translate(146, 126)" filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="0" y="0" width="64" height="260" rx="32" fill="#ffffff" />
    <!-- Horizontal bar -->
    <rect x="0" y="196" width="220" height="64" rx="32" fill="#ffffff" />
    <!-- Tech node representing HasLab innovation -->
    <circle cx="178" cy="64" r="36" fill="#ffffff" />
  </g>
</svg>